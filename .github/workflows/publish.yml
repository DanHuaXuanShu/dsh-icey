# 用 npm Trusted Publishing（OIDC）自动发版 —— 不需要任何长期 token。
#
# 为什么这么做：2026 年 npm 开始废弃「带 bypass 2FA 的 granular token」——
#   2026-08 起不能做账号操作、2027-01 前后不能直接 publish。
# 官方给的替代就是 Trusted Publishing：npm 用 OIDC 校验「这次发布确实来自
# 这个仓库的这个 workflow」，不再需要保存密码或 token。
#
# 一次性准备（在 npmjs.com 上，人工做一次）：
#   Package → dsh-icey → Settings → Trusted Publisher
#     Publisher:    GitHub Actions
#     Organization: DanHuaXuanShu
#     Repository:   dsh-icey
#     Workflow:     publish.yml      ← 必须和这个文件名一致
#     Environment:  （留空）
#
# 之后发版：
#   npm version patch        # 抬版本号并打 tag
#   git push --follow-tags   # 推代码 + tag → 这个 workflow 自动发布
#
# 注意：npm 上包必须先存在（0.1.0 已经存在），Trusted Publisher 才能挂上去。

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # 关键：没有这一行，npm 无法拿到 OIDC 令牌，Trusted Publishing 会失败
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing 需要 npm >= 11.5.1
      - name: 升级 npm
        run: npm install -g npm@latest && npm --version

      # 这个包是**零依赖**，不需要 npm install；直接跑自检和探针当门禁。
      - name: 自检（47 项）
        run: node selfcheck.mjs

      - name: 工具 schema 校验
        run: node probe/schema-check.mjs

      - name: 客户端 bundle 校验
        run: node probe/client-check.mjs

      - name: 插件激活校验（桩 ctx）
        run: node probe/apply-harness.mjs

      # 打印实际会发出去的文件，便于在 Actions 日志里核对
      - name: 预演打包
        run: npm pack --dry-run

      # tag 与 package.json 版本必须一致，否则发出去的版本号和 tag 对不上
      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 的 $PKG 不一致；先 npm version 再推 tag"
            exit 1
          fi

      # --provenance：生成 SLSA 来源证明，npm 页面会显示「已验证来自此仓库」
      # 不用 NODE_AUTH_TOKEN：OIDC 由 npm CLI 自动换取短期凭证
      - name: 发布
        run: npm publish --provenance --access public
